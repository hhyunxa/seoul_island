<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두근두근 블록섬 · 서울섬 데모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#CFEAF6;--panel:#FFFAEA;--fg:#6B4F2E;--sub:#8A6B45;--shadow:rgba(107,79,46,.18);
  --font:'Jua',sans-serif;--weight:400;--accent:#F2A73B;--accentFg:#FFFFFF;--areaBg:#DCF1FA;--areaFg:#23607A;
  --bubble:46% 54% 50% 50% / 60% 60% 40% 40%;
  --mm-sea:#8FD8E8;--mm-sand:#FFF1D0;--mm-grass:#B8E39A;--mm-ring:#3CB44A;--mm-noddle:#FFC4D3;--mm-bridge:#FFF8EC;--mm-me:#F2A73B;
}
body.dusk{
  --bg:#F2B59A;--panel:#FBF3E4;--fg:#3A3150;--sub:#6E5F96;--shadow:rgba(30,22,48,.35);
  --font:'Gowun Batang',serif;--weight:700;--accent:#3A3150;--accentFg:#FFD27A;--areaBg:#3A3150;--areaFg:#FFD27A;
  --bubble:26px;
  --mm-sea:#9C93D6;--mm-sand:#FCE1BE;--mm-grass:#C3D58A;--mm-ring:#5FAE5F;--mm-noddle:#F6D9B4;--mm-bridge:#FBF3E4;--mm-me:#FF8FA3;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab;outline:none}
.hud{position:fixed;z-index:2;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border-radius:999px;box-shadow:0 4px 0 var(--shadow);font-weight:var(--weight);white-space:nowrap}
#tl{left:20px;top:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
#zoneP{padding:8px 20px 8px 10px;font-size:20px}
#area{background:var(--areaBg);color:var(--areaFg);border-radius:999px;padding:3px 12px;font-size:15px}
#bell{padding:6px 16px;font-size:17px}
.coin{width:16px;height:16px;border-radius:50%;background:#F7C544;box-shadow:inset 0 0 0 2px #D9A23B}
#modes{left:50%;top:16px;transform:translateX(-50%);display:flex;gap:6px;background:var(--panel);border-radius:999px;padding:5px;box-shadow:0 4px 0 var(--shadow);pointer-events:auto}
#modes button{font-family:inherit;font-weight:var(--weight);font-size:16px;border:none;border-radius:999px;padding:0 18px;min-height:40px;cursor:pointer;background:transparent;color:var(--fg)}
#modes button[aria-pressed="true"]{background:var(--fg);color:var(--panel)}
#toast{left:50%;top:78px;transform:translateX(-50%);background:var(--fg);color:var(--panel);border-radius:999px;padding:8px 22px;font-size:18px;font-weight:var(--weight);white-space:nowrap;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#ride{left:50%;top:126px;transform:translateX(-50%);padding:6px 10px 6px 16px;font-size:17px;display:none}
#mapWrap{right:16px;top:14px;width:172px;height:172px;border-radius:50%;background:var(--panel);padding:6px;box-sizing:border-box;box-shadow:0 4px 0 var(--shadow)}
#mapWrap svg{display:block;border-radius:50%}
.mm-sea{fill:var(--mm-sea)}.mm-sand{fill:var(--mm-sand)}.mm-grass{fill:var(--mm-grass)}.mm-noddle{fill:var(--mm-noddle)}.mm-me{fill:var(--mm-me)}
.mm-river{fill:none;stroke:var(--mm-sea)}.mm-ring{fill:none;stroke:var(--mm-ring)}.mm-bridge{stroke:var(--mm-bridge)}
#clock{left:20px;bottom:18px;background:var(--panel);border-radius:26px;padding:10px 22px 12px;box-shadow:0 4px 0 var(--shadow);display:flex;flex-direction:column}
#clock small{font-size:14px;font-weight:var(--weight);color:var(--sub)}
#clock b{font-size:38px;line-height:1.08;font-weight:var(--weight)}
#clock b span{font-size:17px}
#help{right:16px;bottom:18px;background:var(--panel);opacity:.95;border-radius:18px;padding:10px 16px;font-family:'Gowun Dodum',sans-serif;font-size:14px;line-height:1.9;box-shadow:0 4px 0 var(--shadow);display:flex;flex-direction:column}
#help b{font-weight:400;background:var(--fg);color:var(--panel);border-radius:6px;padding:1px 7px}
#pad{right:24px;bottom:104px;width:156px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;pointer-events:auto}
#pad button{height:48px;border:none;border-radius:14px;background:var(--panel);color:var(--fg);box-shadow:0 4px 0 var(--shadow);cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:none}
#hint{left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border-radius:24px;padding:18px 28px;font-size:20px;font-weight:var(--weight);box-shadow:0 6px 0 var(--shadow);text-align:center;line-height:1.6}
#prompt{left:50%;bottom:120px;transform:translateX(-50%);pointer-events:auto;font-family:inherit;font-weight:var(--weight);font-size:18px;color:var(--fg);background:var(--panel);border:none;border-radius:999px;padding:6px 20px 6px 8px;min-height:46px;display:none;align-items:center;gap:8px;box-shadow:0 4px 0 var(--shadow);cursor:pointer}
#prompt .k{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accentFg);display:inline-flex;align-items:center;justify-content:center}
#dialog{left:50%;bottom:26px;transform:translateX(-50%);width:min(640px,calc(100vw - 32px));pointer-events:auto;display:none}
#dlgName{position:absolute;top:-14px;left:50px;z-index:1;color:#FFFFFF;font-size:20px;font-weight:var(--weight);padding:6px 20px;border-radius:999px;transform:rotate(-4deg);box-shadow:0 3px 0 var(--shadow)}
#dlgText{display:block;width:100%;text-align:left;font-family:inherit;font-weight:var(--weight);font-size:21px;line-height:1.55;color:var(--fg);background:var(--panel);border:none;border-radius:var(--bubble);padding:32px 60px 28px;min-height:120px;box-shadow:0 6px 0 var(--shadow);cursor:pointer;white-space:pre-line}
#loading{inset:0;display:flex;align-items:center;justify-content:center;font-size:24px}
@media (max-width:760px){#help{display:none}#mapWrap{width:120px;height:120px}#mapWrap svg{width:108px;height:108px}#zoneP{font-size:16px}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="서울섬 3D 데모 화면. WASD 또는 클릭으로 이동, 드래그로 시점 회전"></canvas>

<div class="hud" id="loading">서울섬을 불러오는 중…</div>

<div class="hud" id="tl">
  <span class="pill" id="zoneP"><span id="area">한강</span><span id="zone">노들섬 광장</span></span>
  <span class="pill" id="bell"><span class="coin"></span>12,400 벨</span>
</div>

<div class="hud" id="modes">
  <button type="button" id="btnDay" aria-pressed="true">낮 12:30</button>
  <button type="button" id="btnDusk" aria-pressed="false">노을 6:40</button>
</div>

<div class="hud" id="toast"></div>
<div class="hud pill" id="ride"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="5" y="3" width="14" height="13" rx="3.5" fill="none" stroke="currentColor" stroke-width="2"></rect><path d="M5 10 H19 M8.5 21 L10 16 M15.5 21 L14 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg><span>초록 순환열차</span><span id="rideT" style="background:#3CB44A;color:#FFFFFF;border-radius:999px;padding:2px 12px;font-size:15px"></span></div>

<div class="hud" id="mapWrap">
  <svg viewBox="0 0 700 700" width="160" height="160" aria-hidden="true">
    <rect class="mm-sea" width="700" height="700"></rect>
    <path class="mm-sand" d="M350 60 C450 55 560 95 610 170 C660 245 655 330 640 400 C625 480 600 560 520 610 C450 655 400 660 350 655 C280 660 200 640 140 590 C80 540 55 460 60 380 C65 290 85 200 150 135 C210 80 270 62 350 60 Z"></path>
    <path class="mm-grass" transform="translate(350 360) scale(0.94) translate(-350 -360)" d="M350 60 C450 55 560 95 610 170 C660 245 655 330 640 400 C625 480 600 560 520 610 C450 655 400 660 350 655 C280 660 200 640 140 590 C80 540 55 460 60 380 C65 290 85 200 150 135 C210 80 270 62 350 60 Z"></path>
    <path class="mm-river" d="M10 362 C150 330 250 395 350 375 C450 355 560 400 695 368" stroke-width="104"></path>
    <circle class="mm-ring" cx="350" cy="375" r="185" stroke-width="12"></circle>
    <ellipse class="mm-noddle" cx="350" cy="377" rx="80" ry="34"></ellipse>
    <path class="mm-bridge" d="M212 296 V438 M350 300 V454 M476 302 V446" stroke-width="16"></path>
    <g id="me" transform="translate(350 395)"><path class="mm-me" d="M0 -26 L20 18 L0 8 L-20 18 Z" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"></path></g>
  </svg>
</div>

<div class="hud" id="clock"><small>4월 12일 · 토요일 · 서울섬</small><b><em id="clockT" style="font-style:normal">12:30</em> <span>PM</span></b></div>

<div class="hud" id="help">
  <span><b>WASD</b> 이동 <b style="margin-left:6px">Shift</b> 달리기</span>
  <span><b>클릭</b> 그곳으로 걷기 <b style="margin-left:6px">드래그</b> 시점</span>
  <span><b>E</b> 말걸기 · 열차 타기 <b style="margin-left:6px">휠</b> 확대</span>
</div>

<div class="hud" id="pad">
  <span></span>
  <button type="button" data-k="w" aria-label="앞으로 걷기"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 15 L12 9 L18 15" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
  <span></span>
  <button type="button" data-k="a" aria-label="왼쪽으로 걷기"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 6 L9 12 L15 18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
  <button type="button" data-k="s" aria-label="뒤로 걷기"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 9 L12 15 L18 9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
  <button type="button" data-k="d" aria-label="오른쪽으로 걷기"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 6 L15 12 L9 18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
</div>

<div class="hud" id="hint">WASD로 서울섬을 걸어 보세요<br>땅을 클릭해도 그곳으로 걸어가요</div>

<button type="button" class="hud" id="prompt"><span class="k">E</span><span id="promptT"></span></button>

<div class="hud" id="dialog">
  <span id="dlgName"></span>
  <button type="button" id="dlgText"></button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  if (!window.THREE) { $('loading').textContent = '3D 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'; return; }
  const THREE = window.THREE;

  const game = {
    mode: 'A', talk: null, prompt: '', hint: true, zone: '', area: '',
    keys: {}, tap: {}, goal: null, T: 0, mmT: 0,
    cam: { yaw: 0, pitch: 0.55, dist: 14, tx: 0, ty: 1, tz: 5.8 },
    pl: { x: 0, y: 0.16, z: 5.8, rot: Math.PI, walk: 0 }
  };

  /* ---------- 렌더러 ---------- */
  const canvas = $('c');
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
  catch (err) { $('loading').textContent = '이 브라우저에서는 3D(WebGL)를 켤 수 없어요'; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.05, 900);
  const resize = () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 0.9 ? 62 : 46; camera.updateProjectionMatrix(); };
  addEventListener('resize', resize); resize();
  const curveU = { value: 0.0022 };
  game.renderer = renderer; game.camera = camera; game.curveU = curveU;

  /* ---------- HUD ---------- */
  let toastTimer = 0;
  const showToast = (msg) => { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2200); };
  const hideHint = () => { if (game.hint) { game.hint = false; $('hint').style.display = 'none'; } };
  const setPrompt = (txt) => {
    if (txt === game.prompt) return;
    game.prompt = txt;
    $('promptT').textContent = txt;
    $('prompt').style.display = txt && !game.talk ? 'inline-flex' : 'none';
  };
  const openTalk = (n) => {
    game.talk = n;
    $('dlgName').textContent = n.name; $('dlgName').style.background = n.tag;
    $('dlgText').textContent = n.lines.join('\n');
    $('dialog').style.display = 'block'; $('prompt').style.display = 'none';
  };
  const closeTalk = () => { game.talk = null; $('dialog').style.display = 'none'; if (game.prompt) $('prompt').style.display = 'inline-flex'; };

  const interact = () => {
    if (game.talk) { closeTalk(); return; }
    const t = game.target;
    if (!t) return;
    if (t.kind === 'npc') openTalk(t.o);
    else if (t.kind === 'station') startRide(t.o);
  };

  /* ---------- 열차 타기: 도착 → 탑승 → 운행 → 하차 ---------- */
  const RR = 29.6, OFF = 3.1 / RR;
  function startRide(st) {
    const R = game.R, list = R.stations, i = list.indexOf(st), nx = list[(i + 1) % list.length];
    const a0 = st.ang + OFF;
    let a1 = nx.ang + OFF;
    while (a1 <= a0 + 0.05) a1 += Math.PI * 2;
    game.ride = { phase: 'arrive', t: 0, a0, a1, tx: nx.px, tz: nx.pz, toName: nx.name };
    game.goal = null; game.keys = {}; game.tap = {};
    hideHint();
    setPrompt('');
    $('rideT').textContent = '다음 역 · ' + nx.name + '역';
    $('ride').style.display = 'inline-flex';
    showToast('곧 열차가 들어와요~ 뿌우!');
  }
  function updateRide(dt) {
    const r = game.ride, R = game.R, pl = game.pl, RC = R.rc, c = game.cam;
    r.t += dt;
    const easeIO = (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
    const easeOut = (u) => 1 - (1 - u) * (1 - u);
    const carAt = (a) => [RC[0] + Math.cos(a - OFF) * RR, RC[1] + Math.sin(a - OFF) * RR];
    let walking = false;
    if (r.phase === 'arrive') {
      const u = Math.min(1, r.t / 2.4);
      R.trainA = r.a0 - 0.8 * (1 - easeOut(u));
      if (u >= 1) { r.phase = 'board'; r.t = 0; r.bx = pl.x; r.bz = pl.z; showToast('탑승! 문이 닫힙니다~'); }
    } else if (r.phase === 'board') {
      const u = Math.min(1, r.t / 1.0), p = carAt(r.a0);
      R.trainA = r.a0;
      pl.x = r.bx + (p[0] - r.bx) * u; pl.z = r.bz + (p[1] - r.bz) * u;
      pl.rot = Math.atan2(p[0] - r.bx, p[1] - r.bz); walking = true;
      if (u >= 1) { r.phase = 'ride'; r.t = 0; r.dur = Math.max(5, (r.a1 - r.a0) * 6); }
    } else if (r.phase === 'ride') {
      const u = Math.min(1, r.t / r.dur);
      R.trainA = r.a0 + (r.a1 - r.a0) * easeIO(u);
      const p = carAt(R.trainA);
      pl.x = p[0]; pl.z = p[1]; pl.rot = -(R.trainA - OFF);
      const m = R.trainA - OFF, want = Math.atan2(Math.cos(m), Math.sin(m));
      let dy = want - c.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
      c.yaw += dy * (1 - Math.exp(-1.6 * dt));
      c.pitch += (0.8 - c.pitch) * (1 - Math.exp(-1.6 * dt));
      c.dist += (13 - c.dist) * (1 - Math.exp(-1.6 * dt));
      if (u >= 1) { r.phase = 'alight'; r.t = 0; r.bx = pl.x; r.bz = pl.z; showToast(r.toName + '역 도착! 띵동~'); }
    } else if (r.phase === 'alight') {
      const u = Math.min(1, r.t / 1.0);
      R.trainA = r.a1;
      pl.x = r.bx + (r.tx - r.bx) * u; pl.z = r.bz + (r.tz - r.bz) * u;
      pl.rot = Math.atan2(r.tx - r.bx, r.tz - r.bz); walking = true;
      c.pitch += (0.55 - c.pitch) * (1 - Math.exp(-3 * dt));
      if (u >= 1) { game.ride = null; $('ride').style.display = 'none'; }
    }
    game.trainA = R.trainA;
    return walking;
  }

  const switchMode = (m) => {
    if (m === game.mode) return;
    game.mode = m;
    document.body.classList.toggle('dusk', m === 'C');
    $('btnDay').setAttribute('aria-pressed', String(m === 'A'));
    $('btnDusk').setAttribute('aria-pressed', String(m === 'C'));
    $('clockT').textContent = m === 'A' ? '12:30' : '6:40';
    buildScene(m);
    showToast(m === 'A' ? '낮 12:30 · 맑음' : '노을 6:40 · 불빛이 켜져요');
    canvas.focus({ preventScroll: true });
  };
  $('btnDay').addEventListener('click', () => switchMode('A'));
  $('btnDusk').addEventListener('click', () => switchMode('C'));
  $('prompt').addEventListener('click', () => { interact(); canvas.focus({ preventScroll: true }); });
  $('dlgText').addEventListener('click', () => { closeTalk(); canvas.focus({ preventScroll: true }); });

  /* ---------- 입력: 키보드 ---------- */
  const MOVE = { w: 1, a: 1, s: 1, d: 1, arrowup: 1, arrowdown: 1, arrowleft: 1, arrowright: 1 };
  addEventListener('keydown', (e) => {
    const k = (e.key || '').toLowerCase();
    if (k === 'e' || k === ' ' || k === 'enter') { if (!e.repeat && !game.ride) interact(); e.preventDefault(); return; }
    if (k === 'shift') { game.keys.shift = true; return; }
    if (k === 'escape' && game.talk) { closeTalk(); return; }
    if (MOVE[k]) { game.keys[k] = true; game.tap[k] = performance.now(); game.goal = null; hideHint(); e.preventDefault(); }
  });
  addEventListener('keyup', (e) => { game.keys[(e.key || '').toLowerCase()] = false; });
  addEventListener('blur', () => { game.keys = {}; });

  /* ---------- 입력: 마우스/터치 ---------- */
  let drag = null;
  canvas.addEventListener('pointerdown', (e) => {
    drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: Date.now() };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    canvas.focus({ preventScroll: true });
    hideHint();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const c = game.cam;
    c.yaw -= (e.clientX - drag.x) * 0.006;
    c.pitch = Math.min(1.15, Math.max(0.25, c.pitch + (e.clientY - drag.y) * 0.004));
    drag.x = e.clientX; drag.y = e.clientY;
  });
  const endDrag = (e) => {
    const d = drag; drag = null;
    if (!d) return;
    if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 6 && Date.now() - d.t < 500) clickMove(e.clientX, e.clientY);
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', () => { drag = null; });
  canvas.addEventListener('wheel', (e) => { game.cam.dist = Math.min(28, Math.max(7, game.cam.dist + e.deltaY * 0.01)); e.preventDefault(); }, { passive: false });
  document.querySelectorAll('#pad button').forEach((b) => {
    const k = b.dataset.k;
    const on = (e) => { e.preventDefault(); game.keys[k] = true; game.goal = null; hideHint(); };
    const off = () => { game.keys[k] = false; };
    b.addEventListener('pointerdown', on);
    b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
  });

  function clickMove(cx, cy) {
    if (!game.R || game.ride) return;
    if (game.talk) { closeTalk(); return; }
    const rc = canvas.getBoundingClientRect();
    camera.updateMatrixWorld();
    const v = new THREE.Vector3((cx - rc.left) / rc.width * 2 - 1, -((cy - rc.top) / rc.height * 2 - 1), 0.5).applyMatrix4(camera.projectionMatrixInverse).normalize();
    const c = curveU.value, q = new THREE.Vector3();
    const wy = (t) => { const z = v.z * t; q.set(v.x * t, v.y * t + c * z * z, z).applyMatrix4(camera.matrixWorld); return q.y; };
    let prev = 0.5, hit = -1;
    for (let t = 0.5; t < 260; t += 0.5) { if (wy(t) <= 0.05) { hit = t; break; } prev = t; }
    if (hit < 0) return;
    let lo = prev, hi = hit;
    for (let i = 0; i < 20; i++) { const m = (lo + hi) / 2; if (wy(m) <= 0.05) hi = m; else lo = m; }
    wy(hi);
    game.goal = { x: q.x, z: q.z, t: 0 };
    const mk = game.R.marker;
    if (mk) { mk.visible = true; mk.position.set(q.x, 0.25, q.z); }
  }

  /* ---------- 씬 ---------- */
  function disposeScene() {
    if (!game.S) return;
    game.S.traverse((o) => {

      game.goal = null;
      const l = Math.hypot(mx, mz); mx /= l; mz /= l;
      const fx = -Math.sin(c.yaw), fz = -Math.cos(c.yaw), rx = Math.cos(c.yaw), rzz = -Math.sin(c.yaw);
      dx = rx * mx - fx * mz; dz = rzz * mx - fz * mz;
      moving = true;
    } else if (game.goal && !talking) {
      const gx = game.goal.x - pl.x, gz = game.goal.z - pl.z, gl = Math.hypot(gx, gz);
      if (gl < 0.35) game.goal = null;
      else { dx = gx / gl; dz = gz / gl; moving = true; }
    }
    if (game.ride) {
      if (moving) pl.walk += dt * 11;
    } else if (moving) {
      const sp = (k.shift ? 9 : 5) * dt, ox = pl.x, oz = pl.z;
      if (walkable(pl.x + dx * sp, pl.z)) pl.x += dx * sp;
      if (walkable(pl.x, pl.z + dz * sp)) pl.z += dz * sp;
      if (game.goal) {
        if (Math.hypot(pl.x - ox, pl.z - oz) < sp * 0.25) { game.goal.t += dt; if (game.goal.t > 0.5) game.goal = null; }
        else game.goal.t = 0;
      }
      let d = Math.atan2(dx, dz) - pl.rot; d = Math.atan2(Math.sin(d), Math.cos(d));
      pl.rot += d * (1 - Math.exp(-14 * dt));
      pl.walk += dt * (k.shift ? 16 : 11);
    }
    if (R.marker) {
      if (!game.goal) R.marker.visible = false;
      else { const s = 1 + Math.sin(T * 8) * 0.15; R.marker.scale.set(s, 1, s); }
    }
    const ty = game.ride && game.ride.phase === 'ride' ? 0.6 :game.ride ? 0.12 : onBridge(pl.x, pl.z) ? 0.47 : onPier(pl.x, pl.z) ? 0.4 : onNoddle(pl.x, pl.z) ? 0.16 : 0;
    pl.y += (ty - pl.y) * (1 - Math.exp(-12 * dt));

    const P0 = R.player;
    P0.g.position.set(pl.x, pl.y, pl.z); P0.g.rotation.y = pl.rot;
    const sw = moving ? Math.sin(pl.walk) * 0.7 : 0;
    P0.legs[0].rotation.x = sw; P0.legs[1].rotation.x = -sw;
    P0.arms[0].rotation.x = -sw * 0.8; P0.arms[1].rotation.x = sw * 0.8;
    P0.body.position.y = moving ? Math.abs(Math.sin(pl.walk)) * 0.08 : Math.sin(T * 2) * 0.012;

    let best = null, bd = 1e9;
    R.npcs.forEach((n) => {
      const d = Math.hypot(pl.x - n.x, pl.z - n.z);
      n.body.position.y = Math.abs(Math.sin(T * 2 + n.ph)) * 0.04;
      n.head.rotation.z = Math.sin(T * 1.4 + n.ph) * 0.07;
      n.ears.forEach((e) => { e.rotation.x = Math.sin(T * 2.6 + n.ph) * 0.12; });
      if (d < 6) { let a = Math.atan2(pl.x - n.x, pl.z - n.z) - n.g.rotation.y; a = Math.atan2(Math.sin(a), Math.cos(a)); n.g.rotation.y += a * (1 - Math.exp(-5 * dt)); }
      if (d < 2.8 && d < bd) { bd = d; best = { kind: 'npc', o: n }; }
    });
    if (!best) R.stations.forEach((s) => { const d = Math.hypot(pl.x - s.px, pl.z - s.pz); if (d < 3.4 && d < bd) { bd = d; best = { kind: 'station', o: s }; } });
    if (game.ride) best = null;
    game.target = best;
    let prompt = '';
    if (best && best.kind === 'npc') prompt = best.o.name + '에게 말걸기';
    else if (best) { const i = R.stations.indexOf(best.o); prompt = '열차 타기 · 다음 역 ' + R.stations[(i + 1) % R.stations.length].name + '역'; }
    setPrompt(prompt);
    if (game.talk && !best) closeTalk();

    if (!game.ride) { R.trainA += dt * 0.075; game.trainA = R.trainA; }
    const RC = R.rc;
    R.cars.forEach((g, i) => { const a = R.trainA - i * OFF; g.position.set(RC[0] + Math.cos(a) * RR, 0.14, RC[1] + Math.sin(a) * RR); g.rotation.y = -a; });
    R.karts.forEach((kt) => { kt.a += dt * kt.sp; const x = R.circuit.x + Math.cos(kt.a) * 5.8, z = R.circuit.z + Math.sin(kt.a) * 3.3; kt.g.position.set(x, 0.05, z); kt.g.rotation.y = Math.atan2(-Math.sin(kt.a) * 5.8, Math.cos(kt.a) * 3.3); });
    R.ducks.forEach((d) => { d.g.position.y = d.y + Math.sin(T * 1.6 + d.ph) * 0.06; d.g.rotation.z = Math.sin(T * 1.2 + d.ph) * 0.04; });
    R.sway.forEach((s) => { s.f.rotation.z = Math.sin(T * 1.3 + s.ph) * 0.025; s.f.rotation.x = Math.sin(T * 1.1 + s.ph * 1.7) * 0.02; });
    R.waterTex.offset.x -= dt * 0.18;
    if (R.petals) {
      const pp = R.petals, o = pp.o;
      pp.p.forEach((p, i) => {
        p.y -= p.vy * dt; p.x += p.vx * dt + Math.sin(T * 1.7 + p.ph) * 0.012; p.z += Math.cos(T * 1.3 + p.ph) * 0.01;
        if (p.y < 0.05) { p.y = 6 + Math.random() * 2; p.x = pl.x + (Math.random() - 0.5) * 28; p.z = pl.z - 2 + (Math.random() - 0.65) * 26; }
        o.position.set(p.x, p.y, p.z); o.rotation.set(T * 2 + p.ph, T * 1.3 + p.ph, p.ph); o.updateMatrix();
        pp.m.setMatrixAt(i, o.matrix);
      });
      pp.m.instanceMatrix.needsUpdate = true;
    }
    R.flies.forEach((f) => {
      f.s.position.set(f.x + Math.sin(T * 0.5 * f.sp + f.ph) * 0.9, f.y + Math.sin(T * 0.8 * f.sp + f.ph * 2) * 0.35, f.z + Math.cos(T * 0.45 * f.sp + f.ph) * 0.9);
      const s = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(T * 3 * f.sp + f.ph));
      f.s.scale.set(s, s, 1);
    });

    const e = 1 - Math.exp(-6 * dt);
    c.tx += (pl.x - c.tx) * e; c.ty += (pl.y + 1 - c.ty) * e; c.tz += (pl.z - c.tz) * e;
    const cp = Math.cos(c.pitch), spp = Math.sin(c.pitch);
    camera.position.set(c.tx + Math.sin(c.yaw) * cp * c.dist, c.ty + spp * c.dist, c.tz + Math.cos(c.yaw) * cp * c.dist);
    camera.lookAt(c.tx, c.ty + 0.4, c.tz);

    game.mmT += dt;
    if (game.mmT > 0.15) {
      game.mmT = 0;
      let zone = null, zd = 1e9;
      R.zones.forEach((zn) => { const d = Math.hypot(pl.x - zn[1], pl.z - zn[2]); if (d < zn[3] && d / zn[3] < zd) { zd = d / zn[3]; zone = zn[0]; } });
      const rz = R.rzAt(pl.x);
      const area = pl.z < rz - 8 ? '강북' : pl.z > rz + 8 ? '강남' : '한강';
      if (!zone) zone = area === '한강' ? '한강 위' : area + ' 산책길';
      if (zone !== game.zone) { game.zone = zone; $('zone').textContent = zone; }
      if (area !== game.area) { game.area = area; $('area').textContent = area; }
      const mxp = Math.round(350 + pl.x / 0.16), myp = Math.round(360 + pl.z / 0.16), mr = Math.round(Math.atan2(Math.sin(pl.rot), -Math.cos(pl.rot)) * 180 / Math.PI);
      $('me').setAttribute('transform', 'translate(' + mxp + ' ' + myp + ') rotate(' + mr + ')');
    }
    renderer.render(game.S, camera);
  }

  /* ---------- 시작 ---------- */
  const start = () => {
    buildScene('A');
    $('loading').style.display = 'none';
    canvas.focus({ preventScroll: true });
    const clock = new THREE.Clock();
    const loop = () => { requestAnimationFrame(loop); tick(Math.min(0.05, clock.getDelta())); };
    loop();
  };
  if (document.fonts && document.fonts.ready) Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]).then(start);
  else start();
})();
</script>
</body>
